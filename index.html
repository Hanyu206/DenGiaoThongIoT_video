<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Giám Sát & Điều Khiển Giao Thông IoT - Video</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            position: relative;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #0284c7;
            text-align: center;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .tab-bar {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #0284c7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .content-wrap { display: block; }
        .page { display: none; }
        .page.active {
            display: block;
            animation: fadeInTab 0.25s ease;
        }
        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .traffic-box {
            background: #f8fafc;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .lights {
            display: flex;
            gap: 12px;
            background: #475569;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #475569;
        }
        .light {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            opacity: 0.15;
            transition: all 0.2s ease;
        }
        .light.red { background-color: #ef4444; }
        .light.yellow { background-color: #eab308; }
        .light.green { background-color: #22c55e; }
        .light.red.active { opacity: 1; box-shadow: 0 0 16px #ef4444; }
        .light.yellow.active { opacity: 1; box-shadow: 0 0 16px #eab308; }
        .light.green.active { opacity: 1; box-shadow: 0 0 16px #22c55e; }

        .countdown-box { text-align: right; }
        .countdown-val {
            font-size: 2.2rem;
            font-weight: bold;
            color: #0f172a;
            line-height: 1;
        }
        .countdown-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .card-title {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 6px;
        }
        .card-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0284c7;
        }
        .card-unit { font-size: 0.85rem; color: #64748b; font-weight: normal; }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-auto { background: rgba(34, 197, 94, 0.12); color: #16a34a; border: 1px solid #22c55e; }
        .badge-priority { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid #ef4444; }
        .badge-offline { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid #ef4444; }
